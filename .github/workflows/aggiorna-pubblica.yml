name: Aggiorna dati e pubblica

# Pubblica una volta, poi i dati si aggiornano da soli.
# - gira ogni lunedì mattina e su richiesta (tab Actions -> Run workflow)
# - riscarica le statistiche, ricompila l'app e ripubblica su GitHub Pages

on:
  schedule:
    - cron: "0 6 * * 1"      # ogni lunedì alle 06:00 UTC
  workflow_dispatch:          # avvio manuale dal tab Actions
  push:
    branches: [main]
    paths:                    # se modifichi il codice, ripubblica
      - "app/**"
      - "build.py"
      - "refresh_data.py"
      - ".github/workflows/**"

permissions:
  contents: write             # per committare i dati aggiornati
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          pip install --quiet beautifulsoup4 lxml pillow

      - name: Scarica dati aggiornati e ricompila
        run: python3 refresh_data.py --min-price 0 || echo "::warning::refresh_data.py non riuscito, tengo i dati precedenti"

      # Dati avanzati (xG, tiri). Va DOPO refresh_data.py, che riscrive data.json da zero.
      # Non fallisce mai la build: se la fonte è giù, il file dei dati resta com'è.
      - name: Dati avanzati (xG e tiri)
        run: python3 fetch_extra.py || echo "::warning::fetch_extra.py non riuscito, tengo i dati precedenti"

      - name: Ricompila con i dati avanzati
        run: python3 build.py

      - name: Salva i dati aggiornati nel repository
        run: |
          git config user.name  "fantatrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u app/data.json app/model.js fantatrade.html app/extra_report.txt
          git diff --quiet --cached || git commit -m "dati aggiornati $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
